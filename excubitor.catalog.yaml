services:
  # macOS parent program services. Preparation creates the private relay binary/config.
  # UDP/SRT port; no HTTP health probe. Bind address is the explicitly selected Tailscale IP.
  - code: odeum-broadcast
    name: Odeum SRT program router
    tier: personal
    project_code: Od
    component: broadcast
    port: 8890
    repo: LUDIARS/Odeum
    runtime: app
    cwd: ${ARS_ROOT}/Odeum
    exec: ${ARS_ROOT}/Odeum/artifacts/broadcast/mediamtx
    exec_args: [artifacts/broadcast/mediamtx.yml]
    autostart: false
    allow_hot_reload: false
    health:
      type: process
      interval_sec: 30
  - code: odeum-obs
    name: Odeum macOS OBS parent
    tier: personal
    project_code: Od
    component: obs
    repo: LUDIARS/Odeum
    runtime: app
    cwd: ${ARS_ROOT}/Odeum
    exec: /Applications/OBS.app/Contents/MacOS/OBS
    exec_args: [--profile, Odeum_VANMAC, --collection, Odeum_VANMAC]
    autostart: false
    allow_hot_reload: false
    health:
      type: process
      interval_sec: 30
  # Resident native server with an HTTP health probe. Excubitor has no `native` runtime:
  # `node` spawns `command` as a port-owning resident process regardless of language.
  # Guest phones need ODEUM_RELAY_BIND / LUDIARS_ALLOWED_HOSTS set per site (not here: catalog is shared).
  - code: odeum-relay
    name: Odeum live relay
    tier: personal
    project_code: Od
    component: relay
    port: 4400
    repo: LUDIARS/Odeum
    runtime: node
    cwd: ${ARS_ROOT}/Odeum
    command: native/build/bin/odeum-relay
    autostart: false
    allow_hot_reload: false
    env:
      ODEUM_RELAY_PORT: "4400"
    health:
      type: http
      url: http://localhost:4400/health
      interval_sec: 30
    provides:
      ODEUM_RELAY_URL: http://${host}:${port}
